name: Python Repository Checks

on:
  push:
    paths:
      - "01_Basics/**"
      - "02_Control_Flow_and_Loops/**"
      - "03_Data_Structures_and_Problem_Solving/**"
      - "04_Functions_OOP_Files/**"
      - "05_Modules_and_Standard_Library/**"
      - "06_Advanced_Practice/**"
      - "07_Beginner_Projects/**"
      - ".github/scripts/**"
      - ".github/workflows/python-projects-check.yml"
      - "README.md"
      - "TESTING.md"
  pull_request:
    paths:
      - "01_Basics/**"
      - "02_Control_Flow_and_Loops/**"
      - "03_Data_Structures_and_Problem_Solving/**"
      - "04_Functions_OOP_Files/**"
      - "05_Modules_and_Standard_Library/**"
      - "06_Advanced_Practice/**"
      - "07_Beginner_Projects/**"
      - ".github/scripts/**"
      - ".github/workflows/python-projects-check.yml"
      - "README.md"
      - "TESTING.md"
  workflow_dispatch:

jobs:
  syntax-and-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: >-
          python -m compileall -q
          01_Basics
          02_Control_Flow_and_Loops
          03_Data_Structures_and_Problem_Solving
          04_Functions_OOP_Files
          05_Modules_and_Standard_Library
          06_Advanced_Practice
          07_Beginner_Projects
          .github/scripts
      - name: Test all 110 practice programs
        run: python .github/scripts/test_practice_programs.py
      - name: Smoke-test all 15 beginner projects
        run: python .github/scripts/smoke_test_projects.py
